name: wiwit_app
description: "Wiwit Finance Tracker mobile app"
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  chopper: ^8.7.0
  device_info_plus: ^13.2.0
  flutter_secure_storage: ^10.3.1
  gap: ^3.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  build_runner: ^2.15.1
  chopper_generator: ^8.7.0
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: DMSans
      fonts:
        - asset: fonts/DM_Sans/DMSans-VariableFont_opsz,wght.ttf
        - asset: fonts/DM_Sans/DMSans-Italic-VariableFont_opsz,wght.ttf
          style: italic
