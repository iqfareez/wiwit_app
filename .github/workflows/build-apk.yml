# Build app split apk artifacts

name: Build Android (.apk(s))

"on":
  workflow_dispatch:
    inputs:
      flutterChannel:
        description: "Flutter channel"
        default: stable
        required: true
        type: choice
        options:
          - stable
          - beta
          - master

permissions:
  contents: read
  artifact-metadata: write

jobs:
  build_android:
    runs-on: ubuntu-latest
    env:
      APK_DIR: build/app/outputs/apk/release
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7.0.1

      - name: Setup Java
        uses: actions/setup-java@v5.6.0
        with:
          distribution: "zulu"
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ inputs.flutterChannel }}
          cache: true

      - name: Decoding android/key.properties
        run: echo "${{ secrets.KEY_PROP }}" | base64 --decode > android/key.properties

      - name: Decoding android/key.jks
        run: echo "${{ secrets.KEY_JKS }}" | base64 --decode > android/key.jks

      - name: Get dependencies
        run: flutter pub get

      - name: Build app
        run: flutter build apk --split-per-abi --release

      - name: Upload artifacts (arm64-v8a)
        uses: actions/upload-artifact@v7.0.1
        with:
          name: arm64-v8a artifact
          path: ${{ env.APK_DIR }}/wiwit-v*-arm64-v8a-release.apk

      - name: Upload artifacts (armeabi-v7a)
        uses: actions/upload-artifact@v7.0.1
        with:
          name: armeabi-v7a artifact
          path: ${{ env.APK_DIR }}/wiwit-v*-armeabi-v7a-release.apk

      - name: Upload artifacts (x86_64)
        uses: actions/upload-artifact@v7.0.1
        with:
          name: x86_64 artifact
          path: ${{ env.APK_DIR }}/wiwit-v*-x86_64-release.apk

      - name: Write summary
        run: |
          echo ":blue_heart: Using **`flutter --version`**" >> $GITHUB_STEP_SUMMARY
